name: Continuous Deployment (VPS)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean package --file pom.xml

    - name: Copy JAR to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "bidding-server/target/bidding-server.jar"
        target: "/root"
        strip_components: 2

    - name: Restart Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd /root
          
          echo "Đang dừng Server cũ..."
          pkill -f bidding-server.jar || true
          
          # Đợi 2 giây cho cổng mạng 27915 được hệ điều hành giải phóng hoàn toàn
          sleep 2
          
          echo "Đang khởi động Server mới..."
          nohup java -jar bidding-server.jar > server.log 2>&1 &
          
          echo "✅ Server deploy thành công và đang chạy ngầm!"
